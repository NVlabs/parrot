name: Unit Tests

on:
  push:
    branches: [ main, develop, experimental-parrot-python ]
    paths:
      - '**.cu'
      - '**.hpp'
      - '**.cuh'
      - '**.h'
      - '**.cpp'
      - '**.c'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'python/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [ main, develop, experimental-parrot-python ]
    paths:
      - '**.cu'
      - '**.hpp'
      - '**.cuh'
      - '**.h'
      - '**.cpp'
      - '**.c'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'python/**'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to test for a manual run
        type: choice
        options: [cpp, python]
        default: cpp

jobs:
  unit-tests:
    runs-on: [self-hosted, Linux, X64]
    # Only run on the main NVLabs/parrot repository, not on forks
    if: >-
      github.repository == 'NVLabs/parrot' &&
      github.base_ref != 'experimental-parrot-python' &&
      github.ref_name != 'experimental-parrot-python' &&
      inputs.backend != 'python'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Verify CUDA installation (HPC SDK)
      run: |
        /opt/nvidia/hpc_sdk/Linux_x86_64/26.11/compilers/bin/nvcc --version
        nvidia-smi
        
    - name: Verify dependencies
      run: |
        cmake --version
        which cmake
        which make
        
    - name: Create build directory
      run: mkdir -p build
      
    - name: Configure with CMake
      env:
        CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.11/cuda/13.4
        LD_LIBRARY_PATH: /opt/nvidia/hpc_sdk/Linux_x86_64/26.11/cuda/13.4/targets/x86_64-linux/lib:$LD_LIBRARY_PATH
      run: |
        cd build
        cmake .. -DCUDA_ARCH=AUTO -DCMAKE_CUDA_COMPILER=/opt/nvidia/hpc_sdk/Linux_x86_64/26.11/compilers/bin/nvcc
        
    - name: Build project
      env:
        CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.11/cuda/13.4
        LD_LIBRARY_PATH: /opt/nvidia/hpc_sdk/Linux_x86_64/26.11/cuda/13.4/targets/x86_64-linux/lib:$LD_LIBRARY_PATH
      run: |
        cd build
        cmake --build . -j$(nproc)
        
    - name: Run all unit tests
      run: |
        cd build
        ctest --output-on-failure --verbose
        
    - name: Run main test executable
      run: |
        cd build
        ./parrot_tests
        
    - name: Run individual test categories
      run: |
        cd build
        echo "Running basic operations tests..."
        ./test_basic
        echo "Running sorting tests..."
        ./test_sorting
        echo "Running math operations tests..."
        ./test_math
        echo "Running reductions tests..."
        ./test_reductions
        echo "Running scans tests..."
        ./test_scans
        echo "Running array operations tests..."
        ./test_array_ops
        echo "Running advanced operations tests..."
        ./test_advanced
        echo "Running multidimensional tests..."
        ./test_multidim
        echo "Running integration tests..."
        ./test_integration
        echo "Running top10 tests..."
        ./test_top10
        echo "Running fun tests..."
        ./test_fun

  python-gpu-tests:
    if: >-
      github.repository == 'NVLabs/parrot' &&
      (github.base_ref == 'experimental-parrot-python' ||
       github.ref_name == 'experimental-parrot-python' ||
       inputs.backend == 'python')
    permissions:
      contents: read
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: python/requirements.txt
      - name: Install Python CUDA dependencies
        env:
          PARROT_PYTHON_ENV: ${{ runner.temp }}/parrot-python-env
        run: |
          uv venv --clear --python 3.12 "$PARROT_PYTHON_ENV"
          uv pip install --python "$PARROT_PYTHON_ENV/bin/python" -r python/requirements.txt
      - name: Run Python and fusion GPU tests
        env:
          PARROT_PYTHON_ENV: ${{ runner.temp }}/parrot-python-env
        run: '"$PARROT_PYTHON_ENV/bin/python" -m pytest python -q'
