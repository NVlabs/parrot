name: Python GPU Tests

on:
  pull_request:
    branches: [experimental-parrot-python]
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
  push:
    branches: [experimental-parrot-python]
    paths:
      - 'python/**'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-gpu-tests:
    if: github.repository == 'NVLabs/parrot'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    env:
      PARROT_PYTHON_ENV: ${{ runner.temp }}/parrot-python-env
      CUDA_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install Python CUDA dependencies
        run: |
          python -m venv "$PARROT_PYTHON_ENV"
          "$PARROT_PYTHON_ENV/bin/python" -m pip install -r python/requirements.txt
      - name: Run Python and fusion GPU tests
        run: '"$PARROT_PYTHON_ENV/bin/python" -m pytest python -q'
