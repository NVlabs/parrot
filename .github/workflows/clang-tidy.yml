name: Clang-Tidy Static Analysis

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.cu'
      - '**.hpp'
      - '**.cuh'
      - '**.h'
      - '**.cpp'
      - '**.c'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'scripts/run-clang-tidy.sh'
      - '.clang-tidy-cuda'
      - '.clang-tidy-suppression'
      - '.github/workflows/clang-tidy.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.cu'
      - '**.hpp'
      - '**.cuh'
      - '**.h'
      - '**.cpp'
      - '**.c'
      - 'CMakeLists.txt'
      - 'tests/**'
      - 'scripts/run-clang-tidy.sh'
      - '.clang-tidy-cuda'
      - '.clang-tidy-suppression'
      - '.github/workflows/clang-tidy.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  clang-tidy:
    runs-on: [self-hosted, Linux, X64]
    # Only run on the main NVLabs/parrot repository, not on forks
    if: github.repository == 'NVLabs/parrot'
    
    env:
      CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup LLVM/clang-tidy
      run: |
        echo "Checking for clang-tidy installations..."
        echo "PATH is: $PATH"
        which -a clang-tidy || echo "No clang-tidy in PATH"
        
        # Keep the runner's system and user tool paths, with Homebrew preferred
        # when present. run-clang-tidy.sh enforces the minimum LLVM version.
        if [ -d /home/linuxbrew/.linuxbrew/bin ]; then
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
        fi

        if ! command -v clang-tidy &> /dev/null && command -v brew &> /dev/null; then
          brew install llvm
        fi

        if command -v clang-tidy &> /dev/null; then
          echo "✅ clang-tidy is ready:"
          clang-tidy --version
        else
          echo "❌ Install clang-tidy (LLVM >= 21.1.8) on this runner."
          exit 1
        fi
        
    - name: Verify CUDA installation (HPC SDK)
      run: |
        # Check if nvcc is in PATH, if not, set it up
        if ! command -v nvcc &> /dev/null; then
          export PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin:$PATH
          export CUDA_HOME=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3
        fi
        /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin/nvcc --version
        
    - name: Create build directory
      run: mkdir -p build
      
    - name: Configure with CMake
      env:
        CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3
        LD_LIBRARY_PATH: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3/targets/x86_64-linux/lib:$LD_LIBRARY_PATH
      run: |
        cd build
        cmake .. -DCUDA_ARCH=AUTO -DCMAKE_CUDA_COMPILER=/opt/nvidia/hpc_sdk/Linux_x86_64/26.9/compilers/bin/nvcc
        
    - name: Build project (to fetch dependencies like CCCL)
      env:
        CUDA_HOME: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3
        LD_LIBRARY_PATH: /opt/nvidia/hpc_sdk/Linux_x86_64/26.9/cuda/13.3/targets/x86_64-linux/lib:$LD_LIBRARY_PATH
      run: |
        cd build
        # Build with all cores for speed (as per BUILDING.md)
        cmake --build . -j$(nproc)
        
    - name: Run clang-tidy on parrot.hpp
      run: |
        bash scripts/run-clang-tidy.sh parrot.hpp
        
    - name: Run clang-tidy on all test files
      run: |
        # Run clang-tidy with parallel jobs for speed
        bash scripts/run-clang-tidy.sh tests/*.cu
        
    - name: Check for critical errors
      run: |
        echo "✅ Clang-tidy analysis completed!"
        echo "Note: Warnings are informational. Critical errors would have failed the previous steps."
